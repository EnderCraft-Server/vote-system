# Vote 后台配置样例
# 复制为 config.yaml 后修改；config.yaml 已在 .gitignore 中，不会进仓库。
# 支持环境变量覆盖：VOTE_RPC_SECRET / VOTE_DB_DSN / VOTE_ENV / VOTE_ADMIN_PASSWORD

env: production            # production | development

server:
  rpc_listen: "127.0.0.1:7788"        # 只给 PHP 前台用的 TCP RPC，务必监听回环
  admin_listen: "127.0.0.1:7789"      # 管理界面，建议再套一层 nginx + IP 白名单
  # 允许访问管理界面的来源网段；留空表示不限制（不推荐）
  admin_allowed_cidrs:
    - "127.0.0.1/32"
    - "::1/128"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  max_connections: 256
  max_frame_bytes: 1048576            # 单帧上限 1 MiB

database:
  driver: mysql                       # mysql | memory（memory 仅本地调试，重启丢数据）
  # 例：vote:密码@tcp(127.0.0.1:3306)/vote_system?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s
  dsn: "vote:CHANGE_ME@tcp(127.0.0.1:3306)/vote_system?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&timeout=5s"
  max_open_conns: 32
  max_idle_conns: 8
  conn_max_lifetime: 30m

security:
  # 与 frontend/config/config.php 的 backend.rpc_secret 必须完全一致。
  # 生成：openssl rand -hex 32   或者   php -r "echo bin2hex(random_bytes(32));"
  rpc_secret: "CHANGE_ME_64_HEX_CHARACTERS"
  rpc_clock_skew: 60s                 # 时间戳允许偏移
  rpc_nonce_ttl: 300s                 # 防重放窗口
  admin_session_ttl: 8h
  admin_idle_timeout: 30m
  admin_cookie_secure: true           # 生产环境走 HTTPS 时必须为 true
  admin_login_max_attempts: 5
  admin_login_lockout: 15m
  admin_bcrypt_cost: 12

# 风控：只统计最近 window 内的票，按 IP 聚合打分（规则见 docs/RISK-CONTROL.md）
risk:
  window: 24h
  min_votes: 3              # 少于这个票数不参与打分
  volume_warn: 10           # 该 IP 票数达到这里 +3
  volume_high: 30           # 达到这里 +5（并且直接判"高"）
  burst_per_minute: 5       # 任意 60 秒内 >=5 票 +4
  poll_spread: 3            # 跨 >=3 个投票 +2
  regularity_cv: 0.15       # 票间隔的变异系数低于它 +3（机器节奏）
  ua_change: 3              # 同一 IP 出现 >=3 个不同 UA +2

# 危险操作（删票/删投票）的二次授权。开启后不再使用 TOTP，
# 而是让管理员用外部 OAuth2 身份重新授权一次（Authorization Code 模式）。
oauth:
  enabled: false
  authorize_url: "https://sso.example.com/oauth2/authorize"
  token_url: "https://sso.example.com/oauth2/token"
  userinfo_url: "https://sso.example.com/oauth2/userinfo"
  client_id: ""
  client_secret: ""
  redirect_uri: "https://admin.vote.example.com/oauth/callback"
  scopes: ["openid", "profile", "email"]
  # 从 userinfo 的 JSON 里取字段（支持点号路径，例如 "data.user.id"）
  subject_field: "sub"          # 稳定且唯一的用户标识；GitHub 用 "id"
  email_field: "email"
  allowed_email_domains: []     # 留空不限制；填了则邮箱域名必须在列表里
  timeout: 10s
  pending_ttl: 5m               # 待执行操作的存活时间（状态是一次性的）

captcha:
  enabled: true                       # 图片验证码（人机判别的"人"那一层）
  length: 4                           # 验证码位数（4~8；图片固定 320x100，5 位以上会明显变糊）
  # 工作量证明层：图片验证码会被 OCR/多模态模型破解，PoW 没有可识别的语义，
  # 只能靠算力换答案；再配合"申请越多难度越高"，批量自动化的成本会迅速失控。
  pow:
    enabled: true
    base_bits: 17          # 2^17≈13 万次哈希：桌面约 40ms，手机约 0.2s
    max_bits: 21           # 2^21≈210 万次：桌面约 0.6s，手机约 3.5s
    escalate_every: 3      # 同一 IP 每 3 次申请提高 1 位
    window: 10m
    ttl: 5m
  ttl: 5m                             # 有效期
  max_attempts: 5                     # 同一验证码最多尝试次数
  create_per_ip_per_minute: 10         # 每 IP 每分钟可申请次数

limits:
  vote_per_ip_per_minute: 3           # 每 IP 每分钟提交上限（跨投票）；0 = 不限
  # 一 IP 一票。默认 true（需求硬约束）。只有"验证码抗压测试/演示"才关，
  # 关掉后同一 IP 可以重复投票，生产环境务必保持 true。
  one_vote_per_ip: true
  answer_text_max: 300                # 简答题长度上限

demo:
  seed: false                         # 仅 driver=memory 时有效：写入示例投票
  admin_username: admin
  admin_password: ""                  # 留空则随机生成并打印到日志

log:
  level: info                         # debug | info | warn | error
  format: text                        # text | json
